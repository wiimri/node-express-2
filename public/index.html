<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Mi Repertorio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background-color: #121212;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
      }

      form {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 20px;
      }

      input,
      button {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #444;
        outline: none;
      }

      input {
        background-color: #1e1e1e;
        color: #ffffff;
      }

      button {
        cursor: pointer;
        background-color: #1db954;
        border: none;
        font-weight: bold;
      }

      button:hover {
        filter: brightness(1.1);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid #333;
        padding: 8px;
        text-align: left;
      }

      th {
        background-color: #1e1e1e;
      }

      .acciones button {
        margin-right: 5px;
        background-color: #333;
      }

      .acciones button.eliminar {
        background-color: #e53935;
      }

      .acciones button.editar {
        background-color: #1976d2;
      }

      .info {
        margin-bottom: 10px;
        font-size: 0.9rem;
        color: #ccc;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎵 Mi Repertorio</h1>

      <p class="info">
        Este frontend se conecta al backend Express del desafío "Mi repertorio".
        Puedes agregar, editar y eliminar canciones.
      </p>

      <form id="form-cancion">
        <input
          type="text"
          id="titulo"
          placeholder="Título"
          required
          autocomplete="off"
        />
        <input
          type="text"
          id="artista"
          placeholder="Artista"
          required
          autocomplete="off"
        />
        <input
          type="text"
          id="tono"
          placeholder="Tono (ej: Dm)"
          required
          autocomplete="off"
        />
        <button type="submit" id="btn-guardar">Agregar canción</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Artista</th>
            <th>Tono</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody-canciones"></tbody>
      </table>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
